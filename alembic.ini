[alembic]
script_location = migrations
prepend_sys_path = src

# sqlalchemy.url is deliberately left empty: the URL comes from the DATABASE_URL
# environment variable (migrations/env.py), never from a committed file — see
# CLAUDE.md rule 4. gitleaks would block a committed credential anyway.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
