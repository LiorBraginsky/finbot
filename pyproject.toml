[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finbot"
version = "0.1.0"
description = "Telegram bot that turns speech, text and receipts into household expenses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# migrations/versions: generated migration headers fight the formatter (see
# CLAUDE.md rule notes in docs/plans/stage-0-skeleton.md 1.1).
# docs: ruff's formatter also reformats fenced ```python blocks inside
# Markdown by default; plan/ADR snippets are prose illustrating a decision,
# not source the lint gate should own, and it would make `ruff format --check .`
# permanently fail on every plan file that includes a code excerpt.
extend-exclude = ["migrations/versions", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
