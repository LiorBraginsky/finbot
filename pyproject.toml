[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finbot"
version = "0.1.0"
description = "Telegram bot that turns speech, text and receipts into household expenses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Already installed transitively via aiogram; declared here because
    # Stage 1's OpenRouter client (Step 2) uses it directly, promoting it
    # from transitive to declared. No new package enters the image.
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# migrations/versions: generated migration headers fight the formatter (see
# CLAUDE.md rule notes in docs/plans/stage-0-skeleton.md 1.1).
# *.md: ruff does not own Markdown. Its formatter reformats fenced ```python
# blocks inside Markdown by default; plan/ADR snippets are prose illustrating
# a decision, not source the lint gate should own. Excluding "docs" instead
# of the extension would be both too broad (exempts any future .py file
# placed under docs/ from lint) and too narrow (README.md and CLAUDE.md stay
# latent failures the moment either gains a fenced python block) — stating
# the rule by extension covers every Markdown file, wherever it lives.
extend-exclude = ["migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The category catalog's descriptions are Ukrainian prose, not identifiers —
# RUF001's Latin-homoglyph check exists to catch confusable characters in
# code that could hide a security issue, which does not apply to a private
# bot's own category text in its own language.
"src/finbot/core/categories/catalog.py" = ["RUF001"]
# Every user-facing string the bot ever sends: Ukrainian prose and category
# labels, same justification as the catalog above.
"src/finbot/adapters/telegram/render.py" = ["RUF001", "RUF003"]
# Button labels are Ukrainian, and the ➕ / ✏️ / 🗑 glyphs appear in both the
# labels and the docstrings explaining them.
"src/finbot/adapters/telegram/keyboards.py" = ["RUF001", "RUF002"]
# `query.answer(...)` acknowledgement text for the `🗑 Видалити все` callback
# (docs/plans/stage-2_5-bank-screenshots.md, Step 3) is Ukrainian prose too —
# same justification as render.py above.
"src/finbot/adapters/telegram/handlers.py" = ["RUF001", "RUF002", "RUF003"]
# Asserts the exact Ukrainian/Cyrillic text render.py produces.
"tests/unit/test_render.py" = ["RUF001"]
# Asserts the exact Ukrainian text finbot.adapters.telegram.render.
# render_bank_note produces, same justification as test_render.py above.
"tests/unit/test_render_bank.py" = ["RUF001"]
# Asserts the exact Ukrainian button labels keyboards.py produces.
"tests/unit/test_keyboards.py" = ["RUF001", "RUF002", "RUF003"]
# Uses a Ukrainian string as the stability fixture for the id function.
"tests/unit/test_stable_update_ids.py" = ["RUF001"]
# The currency guard's marker table is Cyrillic words by definition (дол,
# долар, бакс, євро...), and its comments/docstrings quote them and their
# Ukrainian near-homographs (долина, європа) to explain what must NOT match
# — same justification as the catalog above, extended to RUF002/RUF003
# because the quoting happens in docstrings and comments here, not only in
# string literals.
"src/finbot/core/extraction/currency.py" = ["RUF001", "RUF002", "RUF003"]
# Asserts the exact Cyrillic marker table finbot.core.extraction.currency
# matches and rejects.
"tests/unit/test_currency.py" = ["RUF001"]
# The bank-feed calendar's month/weekday tables are Cyrillic words by
# definition (Ukrainian and Russian genitive month names, weekday
# abbreviations) — same justification as currency.py above, extended to
# RUF002/RUF003 for the same reason: the docstrings quote them too.
"src/finbot/core/extraction/bank_dates.py" = ["RUF001", "RUF002", "RUF003"]
# Asserts the exact Cyrillic date headers finbot.core.extraction.bank_dates
# resolves and rejects.
"tests/unit/test_bank_dates.py" = ["RUF001"]
# Bank-feed date headers in both the model-output fixtures and the
# docstrings explaining what they test (a weekday-mismatch case quotes
# "сб"/"пт" in prose), same justification as bank_dates.py above, extended
# to RUF002 for the same reason as currency.py.
"tests/unit/test_evals_bank_scoring.py" = ["RUF001", "RUF002"]
# The transliteration table IS Cyrillic keys — that is the module's entire
# subject — and the docstring quotes both the letters and the labels they come
# from. Same justification as bank_dates.py above.
"src/finbot/core/categories/slugify.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_slugify.py" = ["RUF001", "RUF002"]
# Docstrings and comments naming the ➕ button by its actual glyph, the way
# render.py and handlers.py already name ✏️ and 🗑.
"src/finbot/repo/categories.py" = ["RUF002"]
"src/finbot/repo/expenses.py" = ["RUF002"]
# `_resolve_category`'s docstring names the ➕ button and quotes the
# Ukrainian labels it produces.
"src/finbot/core/extraction/pipeline.py" = ["RUF001", "RUF002"]
"src/finbot/repo/models.py" = ["RUF003"]
# BOT_COMMANDS' descriptions are the exact Ukrainian text Telegram shows in
# the command menu, same justification as the catalog above.
"src/finbot/adapters/telegram/main.py" = ["RUF001"]
# Asserts the exact Ukrainian text of BOT_COMMANDS.
"tests/unit/test_main.py" = ["RUF001"]
# Foreign-currency-marker raw_text fixtures ("10доларів"), same
# justification as the catalog above.
"tests/integration/test_currency_guard.py" = ["RUF001"]
# Asserts the exact Ukrainian category labels reports group by.
"tests/integration/test_reports.py" = ["RUF001"]
# Asserts the exact Ukrainian category labels migration 0006 seeds.
"tests/integration/test_categories_seed.py" = ["RUF001"]
"tests/integration/test_extraction_pipeline.py" = ["RUF001"]
# Voice Ukrainian/Russian transcript text (docs/roadmap.md Stage 2), same
# justification as the catalog above.
"tests/unit/test_extraction_schema.py" = ["RUF001"]
"tests/unit/test_extraction_voice.py" = ["RUF001"]
"tests/integration/test_confirmation_flow.py" = ["RUF001"]
# Ukrainian item text and category labels in seeded rows and assertions.
"tests/integration/test_callback_flow.py" = ["RUF001", "RUF002", "RUF003"]
# Ukrainian message text, proposed category labels and the ➕ glyph.
"tests/integration/test_category_suggestions.py" = ["RUF001", "RUF002"]
"tests/integration/test_message_repo.py" = ["RUF001"]
# Bank-feed merchant strings (Ukrainian prose, and the deliberate "differs
# only by merchant" pin for Approach C2's dedup key), same justification as
# the catalog above.
"tests/integration/test_bank_dedup.py" = ["RUF001"]
# Asserts substrings of the exact Ukrainian note finbot.adapters.telegram.
# render.render_bank_note produces, same justification as the catalog above.
"tests/integration/test_bank_flow.py" = ["RUF001"]
# Asserts the exact Ukrainian `query.answer(...)` text the `delall` handler
# sends, same justification as the catalog above.
"tests/integration/test_delete_all_flow.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
