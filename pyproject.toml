[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finbot"
version = "0.1.0"
description = "Telegram bot that turns speech, text and receipts into household expenses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    # Already installed transitively via aiogram; declared here because
    # Stage 1's OpenRouter client (Step 2) uses it directly, promoting it
    # from transitive to declared. No new package enters the image.
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# migrations/versions: generated migration headers fight the formatter (see
# CLAUDE.md rule notes in docs/plans/stage-0-skeleton.md 1.1).
# *.md: ruff does not own Markdown. Its formatter reformats fenced ```python
# blocks inside Markdown by default; plan/ADR snippets are prose illustrating
# a decision, not source the lint gate should own. Excluding "docs" instead
# of the extension would be both too broad (exempts any future .py file
# placed under docs/ from lint) and too narrow (README.md and CLAUDE.md stay
# latent failures the moment either gains a fenced python block) — stating
# the rule by extension covers every Markdown file, wherever it lives.
extend-exclude = ["migrations/versions", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The category catalog's descriptions are Ukrainian prose, not identifiers —
# RUF001's Latin-homoglyph check exists to catch confusable characters in
# code that could hide a security issue, which does not apply to a private
# bot's own category text in its own language.
"src/finbot/core/categories/catalog.py" = ["RUF001"]
# Every user-facing string the bot ever sends: Ukrainian prose and category
# labels, same justification as the catalog above.
"src/finbot/adapters/telegram/render.py" = ["RUF001"]
# Asserts the exact Ukrainian/Cyrillic text render.py produces.
"tests/unit/test_render.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
